[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wordstream"
version = "0.1.0"
description = "A mobile-first words and fixed phrases read-along PWA"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "angelia-forge" }]
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "httpx>=0.28,<1",
    "mypy==1.14.1",
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff==0.9.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "web/templates/*.html",
    "web/static/*.js",
    "web/static/*.webmanifest",
    "web/static/css/*.css",
    "web/static/js/*.js",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=app --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
