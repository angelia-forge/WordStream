name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      AUTH_MODE: disabled
      DATABASE_URL: sqlite:///./data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy app
      - name: Build CSS
        run: |
          ./scripts/build_css.sh
          git diff --exit-code -- app/web/static/css/app.css
      - name: Migrate
        run: |
          alembic upgrade head
          alembic check
      - name: Test
        run: pytest
