{% extends "base.html" %}

{% block title %}陪读计划 · {{ vocabulary.name }}{% endblock %}

{% block content %}
  <header class="flex min-h-14 items-center gap-3 border-b border-stone-200">
    <a
      href="/vocabularies/{{ vocabulary.id }}"
      class="flex size-11 shrink-0 items-center justify-center text-stone-600 hover:bg-stone-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
      title="返回词库"
    >
      <i data-lucide="arrow-left" class="size-5"></i>
      <span class="sr-only">返回词库</span>
    </a>
    <div class="min-w-0">
      <p class="truncate text-sm text-stone-500">{{ vocabulary.name }}</p>
      <h1 class="text-xl font-semibold">陪读计划</h1>
    </div>
  </header>

  <form
    class="mx-auto w-full max-w-xl space-y-6 py-6"
    data-plan-form
    data-endpoint="/api/v1/vocabularies/{{ vocabulary.id }}/plan"
    data-redirect-url="/vocabularies/{{ vocabulary.id }}?plan_saved=1"
    data-csrf-token="{{ csrf_token }}"
  >
    <section class="grid gap-5 sm:grid-cols-2">
      <label class="block">
        <span class="mb-2 block text-sm font-medium">每日新词数</span>
        <input
          type="number"
          inputmode="numeric"
          name="daily_new_count"
          value="{{ plan.daily_new_count }}"
          min="0"
          max="500"
          required
          class="min-h-11 w-full border border-stone-300 bg-white px-3 text-base focus:border-emerald-600 focus:outline-none focus:ring-1 focus:ring-emerald-600"
        >
      </label>
      <label class="block">
        <span class="mb-2 block text-sm font-medium">每日复习数</span>
        <input
          type="number"
          inputmode="numeric"
          name="daily_review_count"
          value="{{ plan.daily_review_count }}"
          min="0"
          max="500"
          required
          class="min-h-11 w-full border border-stone-300 bg-white px-3 text-base focus:border-emerald-600 focus:outline-none focus:ring-1 focus:ring-emerald-600"
        >
      </label>
    </section>

    <label class="block">
      <span class="mb-2 block text-sm font-medium">自动切换间隔</span>
      <div class="relative">
        <input
          type="number"
          inputmode="numeric"
          name="interval_seconds"
          value="{{ plan.interval_seconds }}"
          min="1"
          max="10"
          required
          class="min-h-11 w-full border border-stone-300 bg-white px-3 pr-14 text-base focus:border-emerald-600 focus:outline-none focus:ring-1 focus:ring-emerald-600"
        >
        <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-stone-500">
          秒
        </span>
      </div>
    </label>

    <fieldset class="divide-y divide-stone-200 border-y border-stone-200">
      <legend class="sr-only">播放方式</legend>
      <label class="flex min-h-14 cursor-pointer items-center justify-between gap-4 py-2">
        <span>
          <strong class="block font-medium">随机播放</strong>
          <span class="text-sm text-stone-500">复习和新词分别随机</span>
        </span>
        <input
          type="checkbox"
          name="is_random"
          {% if plan.is_random %}checked{% endif %}
          class="size-6 accent-emerald-700 focus:ring-2 focus:ring-emerald-500"
        >
      </label>
      <label class="flex min-h-14 cursor-pointer items-center justify-between gap-4 py-2">
        <span>
          <strong class="block font-medium">循环播放</strong>
          <span class="text-sm text-stone-500">播放完后从队首继续</span>
        </span>
        <input
          type="checkbox"
          name="is_loop"
          {% if plan.is_loop %}checked{% endif %}
          class="size-6 accent-emerald-700 focus:ring-2 focus:ring-emerald-500"
        >
      </label>
    </fieldset>

    <p
      class="hidden border-l-2 border-red-500 pl-3 text-sm text-red-700"
      role="alert"
      data-plan-error
    ></p>

    <button
      type="submit"
      class="inline-flex min-h-12 w-full items-center justify-center gap-2 bg-emerald-700 px-5 font-medium text-white hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 disabled:bg-stone-300"
    >
      <i data-lucide="save" class="size-5"></i>
      保存计划
    </button>
  </form>
{% endblock %}
