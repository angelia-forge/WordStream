{% extends "base.html" %}

{% block title %}登录 · WordStream{% endblock %}

{% block content %}
  <header class="flex items-center gap-3 py-4">
    <span class="flex size-11 items-center justify-center bg-emerald-600 text-lg font-semibold text-white">
      W
    </span>
    <h1 class="text-xl font-semibold">WordStream</h1>
  </header>

  <section class="my-auto py-10" aria-labelledby="login-title">
    <div class="mb-8">
      <p class="mb-2 text-sm font-medium text-emerald-700">个人学习空间</p>
      <h2 id="login-title" class="text-3xl font-semibold">登录</h2>
    </div>

    <form method="post" action="/login" class="space-y-5">
      <div>
        <label for="password" class="mb-2 block text-sm font-medium">访问密码</label>
        <div class="relative">
          <i data-lucide="lock-keyhole" class="pointer-events-none absolute left-4 top-3.5 size-5 text-stone-500"></i>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            autofocus
            class="min-h-12 w-full border border-stone-300 bg-white pl-12 pr-4 text-base outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
          >
        </div>
        {% if error %}
          <p class="mt-2 text-sm text-red-700" role="alert">{{ error }}</p>
        {% endif %}
      </div>

      <button
        type="submit"
        class="flex min-h-12 w-full items-center justify-center gap-2 bg-stone-950 px-5 font-medium text-white hover:bg-stone-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
      >
        <span>进入</span>
        <i data-lucide="arrow-right" class="size-5"></i>
      </button>
    </form>
  </section>
{% endblock %}
